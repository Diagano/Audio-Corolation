[package]
name = "audio-offset"
version = "0.1.0"
edition = "2021"
description = "Offset between two versions of the same programme (e.g. language dubs) from shared background events"

[lib]
name = "audio_offset"
path = "src/lib.rs"

[[bin]]
name = "audio-offset"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "audio-offset-cli"
path = "src/bin/cli.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_plot", "dep:rfd", "dep:rodio"]

[dependencies]
rustfft = "6.4.1"
serde_json = "1.0.154"
eframe = { version = "0.37.0", features = ["persistence"], optional = true }
egui_plot = { version = "0.38.0", optional = true }
rfd = { version = "0.17.2", optional = true }
rodio = { version = "0.23.0", default-features = false, features = ["playback"], optional = true }

[profile.release]
lto = true
strip = true
